name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. patchkite release-react ...
        2. Open the app ...
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Patchkite server, CLI, and SDK versions; React Native or Flutter version; OS.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output, e.g. from `patchkite debug android`. Remove deployment keys and secrets.
      render: shell
