# Production deployment: Caddy (HTTPS) + Patchkite server + PostgreSQL.
# Storage uses external S3 (AWS S3 / Cloudflare R2) configured in docker/.env.
# Full guide: https://docs.patchkite.com/self-hosting/production/
name: patchkite

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: patchkite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env}
      POSTGRES_DB: patchkite
    volumes: [pgdata:/var/lib/postgresql/data, ./backups:/backups]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patchkite"]
      interval: 5s
      retries: 10

  server:
    # Published image; `docker compose build` builds it from this checkout instead.
    image: ${PATCHKITE_IMAGE:-ghcr.io/patchkite/server:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://patchkite:${POSTGRES_PASSWORD}@postgres:5432/patchkite
      PUBLIC_URL: https://${PATCHKITE_DOMAIN:?set PATCHKITE_DOMAIN in docker/.env}
      TRUST_PROXY: "true"
      STORAGE_DRIVER: s3
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-patchkite}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      BLOB_DOWNLOAD_MODE: ${BLOB_DOWNLOAD_MODE:-redirect}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 15s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [server]
    environment:
      PATCHKITE_DOMAIN: ${PATCHKITE_DOMAIN}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data, caddy_config:/config]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
