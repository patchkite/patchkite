name: patchkite

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: patchkite
      POSTGRES_PASSWORD: patchkite
      POSTGRES_DB: patchkite
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patchkite"]
      interval: 5s
      retries: 10

  # S3-compatible storage (RustFS). Can be replaced with AWS S3 / Cloudflare R2 via the S3_* env vars.
  s3:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: patchkite
      RUSTFS_SECRET_KEY: patchkite-secret
      RUSTFS_CONSOLE_ENABLE: "true"
    command: /data
    volumes: [s3data:/data]
    ports: ["9000:9000", "9001:9001"]

  server:
    profiles: [full]
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      s3: { condition: service_started }
    environment:
      DATABASE_URL: postgres://patchkite:patchkite@postgres:5432/patchkite
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://s3:9000
      # S3 endpoint reachable by devices (presigned URLs). Replace with a public host in production,
      # or set BLOB_DOWNLOAD_MODE=proxy to download through the server.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      BLOB_DOWNLOAD_MODE: ${BLOB_DOWNLOAD_MODE:-redirect}
      S3_BUCKET: patchkite
      S3_ACCESS_KEY_ID: patchkite
      S3_SECRET_ACCESS_KEY: patchkite-secret
      S3_FORCE_PATH_STYLE: "true"
    ports: ["3000:3000"]

volumes:
  pgdata:
  s3data:
